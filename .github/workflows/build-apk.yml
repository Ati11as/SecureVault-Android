name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.10"
  ANDROID_HOME: /usr/local/lib/android/sdk
  BUILD_TOOLS: /usr/local/lib/android/sdk/build-tools/35.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Sign release APK
        run: |
          set -e
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/securevault-release.keystore" \
            -storepass "changeit" \
            -keypass "changeit" \
            -alias "securevault" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SecureVault, OU=Personal, O=SecureVault, L=NA, ST=NA, C=US"

          "$BUILD_TOOLS/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/securevault-release.keystore" \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias securevault \
            --out app/build/outputs/apk/release/SecureVault-2.1-release-signed.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose \
            app/build/outputs/apk/release/SecureVault-2.1-release-signed.apk

          rm -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-release-apk-signed
          path: app/build/outputs/apk/release/SecureVault-2.1-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SecureVault 2.1 build ${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/SecureVault-2.1-release-signed.apk
